<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <title>Bulk Attachment Deleter — Progress</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="progress.css" />
</head>

<body>
    <header>
        <h1>進捗</h1>
        <p class="subtitle">添付ファイルのバックアップと削除を実行中です。</p>
    </header>

    <main>
        <div class="row">
            <div id="label" class="label">準備中…</div>
        </div>

        <div class="row bar">
            <progress id="bar" max="0" value="0" aria-label="進捗バー"></progress>
            <div id="pct" class="pct">0%</div>
        </div>

        <div id="warn" class="warn" hidden></div>
        <div id="error" class="error" hidden></div>
    </main>

    <footer>
        <button id="cancel" class="secondary">キャンセル</button>
        <button id="close" class="secondary" hidden>閉じる</button>
    </footer>

    <template id="msgTpl">
        <div class="msg"></div>
    </template>

    <script src="progress.js"></script>
    <noscript>
        <div class="error" style="margin:12px 20px;">
            このページは JavaScript を必要とします。
        </div>
    </noscript>
</body>

</html>
