<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8" />
    <title data-i18n="progressPageTitle">Bulk Attachment Deleter — Progress</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="progress.css" />
</head>

<body>
    <header>
        <h1 data-i18n="progressTitle">Progress</h1>
        <p class="subtitle" data-i18n="processing">Processing attachments</p>
    </header>

    <main>
        <div class="row">
            <div id="label" class="label" data-i18n="loading">Loading…</div>
        </div>

        <div class="row bar">
            <progress id="bar" max="0" value="0" aria-label="Attachment operation progress" data-i18n-aria-label="progressBarLabel"></progress>
            <div id="pct" class="pct">0%</div>
        </div>

        <div id="warn" class="warn" hidden></div>
        <div id="error" class="error" hidden></div>
        <p id="summary" aria-live="polite" hidden></p>
        <details id="details" hidden>
            <summary id="details-title"></summary>
            <pre id="results"></pre>
        </details>
    </main>

    <footer>
        <button id="cancel" class="secondary" data-i18n="cancel">Cancel</button>
        <button id="close" class="secondary" hidden data-i18n="close">Close</button>
    </footer>

    <template id="msgTpl">
        <div class="msg"></div>
    </template>

    <script src="../shared/i18n.js"></script>
    <script src="progress.js"></script>
    <noscript>
        <div class="error" style="margin:12px 20px;" data-i18n="javascriptRequired">This page requires JavaScript. Please check your browser settings.</div>
    </noscript>
</body>

</html>
