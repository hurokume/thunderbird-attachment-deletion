<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="preflightPageTitle">Bulk Attachment Deleter — Large Selection</title>
    <link rel="stylesheet" href="confirm.css" />
</head>
<body>
    <header>
        <h1 data-i18n="preflightTitle">Confirm before evaluation</h1>
        <p class="subtitle" data-i18n="preflightSubtitle">Before scanning the messages, please confirm you want to continue.</p>
    </header>
    <section>
        <h2 id="count"></h2>
        <p class="muted" data-i18n="preflightHint">If you have selected more than 100 messages, scanning and backup may take a while.</p>
        <p class="warn" data-i18n="preflightInstructions">No messages have been scanned or modified yet. Choose Continue to scan the messages and review the attachments.</p>
    </section>
    <footer>
        <div id="error" class="error" hidden role="alert"></div>
        <div class="buttons">
            <button id="cancel" class="secondary" data-i18n="cancel">Cancel</button>
            <button id="ok" class="primary" data-i18n="continueButton">Continue</button>
        </div>
    </footer>
    <script src="../shared/i18n.js"></script>
    <script src="preflight.js"></script>
    <noscript><p class="error" data-i18n="javascriptRequired">This page requires JavaScript. Please check your browser settings.</p></noscript>
</body>
</html>
